# Réglages du radar. Tu peux modifier toutes ces valeurs sans toucher au code.
# Les prix sont des allers-retours, par personne, en euros.

[search]
origin_city = "PAR"              # code de ville utilisé par Travelpayouts
origin_airports = "CDG,ORY"      # aéroports utilisés par Google Flights
currency = "eur"
market = "fr"
months_ahead = 9                 # surveille les départs sur les 9 prochains mois
min_days_ahead = 14              # ignore les départs trop proches
adults = 1

[site]
name = "Eunodia"
url = "https://eunodia.com/"
marker = "800338"                # identifiant partenaire Travelpayouts
project = "595480"
program = "4114"
campaign = "100"
hotels_program = ""              # identifiant du programme d'hôtels, une fois accepté
hotels_campaign = ""
tours_program = "2074"           # Tiqets
tours_campaign = "89"
claims_program = "9139"          # AirHelp
claims_campaign = "120"
cars_program = "2043"            # Localrent
cars_campaign = "87"
esim_program = "8310"            # Airalo
esim_campaign = "541"
transfers_program = "647"        # Kiwitaxi
transfers_campaign = "1"
newsletter_url = "https://ab67ba27.sibforms.com/serve/MUIFAM-kHU83B6EgUuJ_iQCwDIAdSkqGaPzD5JsqC1KOFwptmrVOXZCkYHxj64A5Tlzv97_wB1FNlfeCBf2koPxWus803zLxB5UwH2I6fG2W_4iIQaCSQG8C8QbuRaWaRz5AT8KFAdNPxwMO1jje1ls2WDo3RLkRtU3JDpgomWT_3VlaOG5kyu3kUJ9MjieaDIV4ojaPWdTxPlPlrA=="              # adresse d'envoi du formulaire Brevo
analytics_token = "71176418a1124737b274a50c21f6e2a5"  # identifiant public de Cloudflare Web Analytics ; vide = pas de mesure
test_api = "https://radar-flight-test.joseluiscardozopintos.workers.dev"                    # adresse du serveur de test ; vide = mode démonstration

[world]
origins = ["LON", "PAR", "MAD", "BCN", "ROM", "BER", "AMS", "LIS", "IST", "DXB", "DEL", "BKK", "SIN", "HKG", "TYO", "SEL", "SYD", "JNB", "CAI", "CMN", "NYC", "LAX", "MIA", "YTO", "MEX", "BOG", "LIM", "SAO", "BUE", "SCL"]

[schedule]
min_hours = 0.75                 # le radar relève les prix une fois par heure
verify_hours = 12                # et consulte Google Flights au plus toutes les 12 heures

[alerts]
deal_drop = 0.25                 # bonne affaire = 25 % sous le prix habituel
min_history_days = 6             # jours d'historique requis avant de juger un prix « habituel »
realert_days = 7                 # ne répète pas la même alerte pendant 7 jours...
realert_drop = 0.05              # ...sauf si le prix baisse encore de 5 %
max_per_email = 10
email_every_days = 2             # une alerte par e-mail au maximum tous les deux jours

[serpapi]
monthly_limit = 240              # l'offre gratuite donne 250 recherches, on garde une marge
per_run_limit = 4                # vérifications Google Flights maximum par passage

# Chaque groupe a son budget maximum.
# - countries : toutes les destinations de ces pays (codes pays à 2 lettres)
# - cities    : villes vérifiées mois par mois (codes ville à 3 lettres)

[[group]]
name = "Argentine et Chili"
countries = ["AR", "CL"]
cities = ["BUE", "SCL"]
max_price = 800
min_days = 10
max_days = 120

[[group]]
name = "Paraguay"
countries = ["PY"]
cities = ["ASU"]
max_price = 800
min_days = 10
max_days = 120

[[group]]
name = "États-Unis"
countries = ["US"]
cities = ["NYC", "LAX", "MIA", "SFO"]
max_price = 380
min_days = 7
max_days = 120

[[group]]
name = "Canada"
countries = ["CA"]
cities = ["YMQ", "YTO", "YVR"]
max_price = 400
min_days = 7
max_days = 120

# Mexique « à la limite » : budget volontairement plus strict.
[[group]]
name = "Mexique"
countries = ["MX"]
cities = ["MEX", "CUN"]
max_price = 450
min_days = 7
max_days = 30

[[group]]
name = "Europe"
countries = ["AL", "AT", "BA", "BE", "BG", "CH", "CY", "CZ", "DE", "DK", "EE", "ES", "FI", "GB", "GR", "HR", "HU", "IE", "IS", "IT", "LT", "LU", "LV", "ME", "MK", "MT", "NL", "NO", "PL", "PT", "RO", "RS", "SE", "SI", "SK"]
cities = []
max_price = 70
min_days = 2
max_days = 10

[[group]]
name = "Asie"
countries = ["CN", "HK", "IN", "JP", "KH", "KR", "LA", "LK", "MY", "NP", "PH", "SG", "TH", "TW", "VN"]
cities = ["BKK", "TYO"]
max_price = 550
