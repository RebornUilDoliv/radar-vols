# Réglages du radar. Tu peux modifier toutes ces valeurs sans toucher au code.
# Les prix sont des allers-retours, par personne, en euros.

[search]
origin_city = "PAR"              # code de ville utilisé par Travelpayouts
origin_airports = "CDG,ORY"      # aéroports utilisés par Google Flights
currency = "eur"
market = "fr"
months_ahead = 9                 # surveille les départs sur les 9 prochains mois
min_days_ahead = 14              # ignore les départs trop proches
adults = 1

[site]
name = "Radar Flight"
url = "https://rebornuildoliv.github.io/radar-vols/"   # à remplacer par le vrai domaine
marker = "800338"                # identifiant partenaire Travelpayouts
project = "595480"
program = "4114"
campaign = "100"
hotels_program = ""              # identifiant du programme d'hôtels, une fois accepté
hotels_campaign = ""
tours_program = "2074"           # Tiqets
tours_campaign = "89"
claims_program = "9139"          # AirHelp
claims_campaign = "120"
test_api = "https://radar-flight-test.joseluiscardozopintos.workers.dev"                    # adresse du serveur de test ; vide = mode démonstration

[schedule]
min_hours = 12                   # le radar vérifie toutes les 2 heures, et relève au plus toutes les 12 heures

[alerts]
deal_drop = 0.25                 # bonne affaire = 25 % sous le prix habituel
min_history_days = 6             # jours d'historique requis avant de juger un prix « habituel »
realert_days = 7                 # ne répète pas la même alerte pendant 7 jours...
realert_drop = 0.05              # ...sauf si le prix baisse encore de 5 %
max_per_email = 10

[serpapi]
monthly_limit = 240              # l'offre gratuite donne 250 recherches, on garde une marge
per_run_limit = 4                # vérifications Google Flights maximum par passage

# Chaque groupe a son budget maximum.
# - countries : toutes les destinations de ces pays (codes pays à 2 lettres)
# - cities    : villes vérifiées mois par mois (codes ville à 3 lettres)

[[group]]
name = "Argentine et Chili"
countries = ["AR", "CL"]
cities = ["BUE", "SCL"]
max_price = 800
min_days = 10
max_days = 120

[[group]]
name = "Paraguay"
countries = ["PY"]
cities = ["ASU"]
max_price = 800
min_days = 10
max_days = 120

[[group]]
name = "États-Unis"
countries = ["US"]
cities = ["NYC", "LAX", "MIA", "SFO"]
max_price = 380
min_days = 7
max_days = 120

[[group]]
name = "Canada"
countries = ["CA"]
cities = ["YMQ", "YTO", "YVR"]
