max_days = 30

# Pas de budget ici : alerte seulement si Google Flights juge le prix bas.
[[group]]
name = "Corée du Nord"
countries = ["KP"]
cities = ["FNJ"]
market_low_only = true
min_days = 10
max_days = 30

[[group]]
name = "Océanie"
countries = ["AU", "FJ", "NZ"]
cities = ["SYD"]
max_price = 900
min_days = 14
max_days = 35

[newsletter]
list_id = 2                      # liste Brevo des abonnés
sender = "contact@eunodia.com"
