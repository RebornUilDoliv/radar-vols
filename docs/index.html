<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar de vols</title>
  <meta name="description" content="Repérer des vols pas chers au départ de Paris.">
  <style>
    :root { --bg: #f6f7f9; --card: #ffffff; --text: #18202b; --muted: #5b6675; --accent: #0b63ce; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #101620; --card: #1a2230; --text: #eef1f5; --muted: #a3aebc; --accent: #6eb0ff; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, sans-serif; }
    main { max-width: 560px; width: 100%; background: var(--card); padding: 32px; border-radius: 14px; }
    h1 { margin: 0 0 8px; font-size: 32px; line-height: 1.2; }
    p { margin: 12px 0 0; color: var(--muted); }
    strong { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>✈️ Radar de vols</h1>
    <p>Un outil pour repérer des vols pas chers au départ de Paris, vers l'Europe, les Amériques, l'Asie et l'Océanie.</p>
    <p><strong>Site en préparation.</strong> Les prix et leur évolution seront bientôt affichés ici.</p>
  </main>
</body>
</html>
