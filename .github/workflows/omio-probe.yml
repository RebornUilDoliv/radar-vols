name: Test API Impact (Omio)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lister les catalogues (sans afficher les secrets)
        env:
          SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          TOKEN: ${{ secrets.AUTH_TOKEN_IMPACT }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          sid, token = os.environ["SID"].strip(), os.environ["TOKEN"].strip()
          print("SID présent:", bool(sid), "commence par IR:", sid.startswith("IR"), "| token présent:", bool(token))
          def get(url):
              req = urllib.request.Request(url, headers={"Accept": "application/json",
                  "Authorization": "Basic " + base64.b64encode(f"{sid}:{token}".encode()).decode()})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300].decode("utf-8", "replace")
          status, data = get(f"https://api.impact.com/Mediapartners/{sid}/Catalogs?PageSize=50")
          print("Catalogs:", status)
          if status != 200:
              print(data); raise SystemExit(1)
          cats = data.get("Catalogs", [])
          print("clés:", sorted(k for k in data if not k.startswith("@")), "| nb:", len(cats))
          if cats: print("champs catalogue:", sorted(cats[0].keys()))
          for c in cats:
              print(c.get("Id"), c.get("Name"), c.get("Language"), c.get("Currency"), c.get("NumberOfItems"), c.get("ItemsUri"))
          if cats:
              uri = cats[0]["ItemsUri"]
              status, items = get("https://api.impact.com" + uri + ("&" if "?" in uri else "?") + "PageSize=3")
              print("Items:", status, {k: v for k, v in items.items() if k.startswith("@")} if isinstance(items, dict) else items)
              if isinstance(items, dict) and items.get("Items"):
                  it = items["Items"][0]
                  print(json.dumps({k: v for k, v in it.items() if v not in ("", None, [], {})}, ensure_ascii=False, indent=1)[:2500])
          PY
