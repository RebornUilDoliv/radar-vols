name: Test API Impact (Omio)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer le catalogue Omio français
        env:
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          AUTH_TOKEN_IMPACT: ${{ secrets.AUTH_TOKEN_IMPACT }}
        run: python -c "import omio; omio.CATALOGS = {'fr': 12203}; import sys; sys.argv.append('--force'); omio.main()"
      - uses: actions/upload-artifact@v4
        with:
          name: omio
          path: docs/omio
          retention-days: 3
