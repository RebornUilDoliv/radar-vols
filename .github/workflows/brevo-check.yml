name: brevo-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        shell: python
        run: |
          import json, os, sys, urllib.request, urllib.error
          key = os.environ["BREVO_API_KEY"].strip()
          print("longueur ok" if len(key) > 20 else "cle vide ou trop courte")
          def call(method, path, body=None):
              req = urllib.request.Request("https://api.brevo.com/v3" + path, method=method,
                  data=json.dumps(body).encode() if body else None,
                  headers={"api-key": key, "content-type": "application/json", "accept": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:300].decode(errors="replace")
          code, text = call("POST", "/emailCampaigns", {
              "name": "Test technique - a supprimer", "subject": "Test technique",
              "sender": {"name": "Eunodia", "email": "contact@eunodia.com"},
              "htmlContent": "<html><body>Test <a href=\"{{ unsubscribe }}\">x</a></body></html>",
              "recipients": {"listIds": [2]}})
          print("creation brouillon:", code, text if code >= 300 else "")
          if code >= 300:
              sys.exit(1)
          cid = json.loads(text)["id"]
          code, text = call("DELETE", f"/emailCampaigns/{cid}")
          print("suppression brouillon:", cid, code, text if code >= 300 else "")
