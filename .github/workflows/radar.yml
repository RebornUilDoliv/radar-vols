name: Radar de vols

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Envoyer seulement un e-mail d'exemple"
        type: boolean
        default: false
      auto:
        description: "Ignorer le passage si le dernier relevé est trop récent"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: https://eunodia.com/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Chercher les vols
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY || secrets.SERPAPY_KEY }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python radar.py ${{ (github.event_name == 'schedule' || inputs.auto) && '--auto' || '' }} ${{ inputs.test_email && '--test-email' || '' }}
      - name: Relever les prix mondiaux
        if: ${{ !inputs.test_email }}
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python world.py
      - name: Construire le site
        if: ${{ !inputs.test_email }}
        run: python build_site.py
      - name: Sauvegarder l'historique des prix
        if: ${{ !cancelled() }}
        run: |
          [ -f data/state.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/prices.json docs/world.json
          git diff --cached --quiet || git commit -m "Mise à jour de l'historique des prix"
          git push
      - name: Préparer le site
        if: ${{ !inputs.test_email }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Mettre le site en ligne
        if: ${{ !inputs.test_email }}
        uses: actions/deploy-pages@v4
